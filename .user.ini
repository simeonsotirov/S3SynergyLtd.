; Per-directory PHP overrides (works under both mod_php and PHP-FPM).
; post_max_size/upload_max_filesize are raised above the app's own
; MAX_CONTENT_LENGTH (8 MiB, see lib/bootstrap.php) so PHP's own request-body
; guard never fires ahead of our code's clean 413 handling — otherwise a
; request exactly at PHP's 8M default would abort with a raw PHP warning
; and a locked-in 200 status before index.php gets to run.
post_max_size = 10M
upload_max_filesize = 10M
display_errors = Off
expose_php = Off
